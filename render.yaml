# Render Blueprint: one free web service (API + web app) in Frankfurt.
# The database is external (Neon free tier, see README): Render asks for DATABASE_URL on setup.
# On render.com: New → Blueprint → select this repository.
services:
  - type: web
    name: davegantt
    runtime: docker
    region: frankfurt
    plan: free # sleeps after 15 min of inactivity; use "starter" to keep it always on
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # entered in the Render dashboard, never committed
      - key: TRUST_PROXY
        value: 'true'
      - key: LOG_LEVEL
        value: info
