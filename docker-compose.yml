services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: davegantt
      POSTGRES_PASSWORD: davegantt
      POSTGRES_DB: davegantt
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U davegantt -d davegantt']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
