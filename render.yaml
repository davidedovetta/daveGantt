# Render Blueprint: one web service (API + web app) and a managed PostgreSQL, in Frankfurt.
# On render.com: New → Blueprint → select this repository.
databases:
  - name: davegantt-db
    region: frankfurt
    plan: free # free databases expire after 30 days: switch to a paid plan before storing real data
    databaseName: davegantt
    user: davegantt

services:
  - type: web
    name: davegantt
    runtime: docker
    region: frankfurt
    plan: free # sleeps after 15 min of inactivity; use "starter" to keep it always on
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: davegantt-db
          property: connectionString
      - key: TRUST_PROXY
        value: 'true'
      - key: LOG_LEVEL
        value: info
